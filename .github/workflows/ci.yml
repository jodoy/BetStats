name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BetStats.slnx

      - name: Build
        run: dotnet build BetStats.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/BetStats.UnitTests --configuration Release --no-build

      - name: Architecture tests
        run: dotnet test tests/BetStats.ArchitectureTests --configuration Release --no-build

      - name: Verify Docker for integration tests
        run: docker info

      - name: PostgreSQL integration tests
        run: dotnet test tests/BetStats.IntegrationTests --configuration Release --no-build
