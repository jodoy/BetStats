name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BetStats.slnx

      - name: Build
        run: dotnet build BetStats.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BetStats.slnx --configuration Release --no-build
