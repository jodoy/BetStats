name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BetStats.slnx

      - name: Build
        run: dotnet build BetStats.slnx --configuration Release --no-restore

      # Test projects are introduced with the first quality-foundation issues.
      # Keep this workflow green during BS-001 instead of inventing empty tests.
