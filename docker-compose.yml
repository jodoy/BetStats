services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-betstats}
      POSTGRES_USER: ${POSTGRES_USER:-betstats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betstats-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - betstats-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betstats} -d ${POSTGRES_DB:-betstats}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  betstats-postgres:
